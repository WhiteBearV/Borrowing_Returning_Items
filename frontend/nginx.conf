# จำกัดอัตราการยิง /auth/login และ /auth/forgot-password — 5 ครั้ง/นาที ต่อ IP
# กัน brute-force รหัสผ่าน (student_id เป็นเลขเรียงเดาได้) และกัน mail bomb
# ทำที่ nginx เพราะไม่ต้องเพิ่ม dependency ฝั่ง Python และตัดตั้งแต่ขอบก่อนถึง worker
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=5r/m;
limit_req_status 429;

# server :80 เหลือหน้าที่เดียว = redirect ไป https ทั้งหมด
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # self-signed สำหรับ pilot บน LAN คณะ (ยังไม่มีโดเมนจริง) — สร้างด้วย ./gen-self-signed-cert.sh
    # วันมีโดเมนจริง: ออก cert ด้วย certbot แล้ว mount ทับที่ path เดิมนี้ ไม่ต้องแก้ที่อื่น
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # security headers — HSTS max-age สั้นไว้ก่อนเพราะ cert self-signed ยังไม่นิ่ง
    # (พอสลับไป CA จริงค่อยยืด max-age ยาวขึ้น)
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # ไฟล์ใหญ่สุดที่รับคือทะเบียน import 10MB — เผื่อ multipart overhead เป็น 11m
    # ตัดที่นี่ก่อนถึง Python เพราะ FastAPI อ่านไฟล์เข้า RAM ก่อนเช็คขนาด
    client_max_body_size 11m;

    # OCR ทะเบียนจากรูป/PDF ใช้เวลานานกว่า request ปกติ
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ─────────────────────────────────────────────────────────────
    # ทุก request ฝั่ง API วิ่งผ่าน /api แล้วตัด prefix ทิ้งก่อนส่งเข้า backend
    # ตรงกับ proxy ที่ vite.config.js มีอยู่แล้ว dev/prod จึงใช้ path ชุดเดียวกัน
    #
    # ห้ามเปลี่ยนไป proxy ตาม prefix ตรง ๆ: route ฝั่ง React มี /dashboard
    # และ /equipment ซึ่งชนกับ API prefix พอดี จะกลายเป็นเสิร์ฟ JSON แทนหน้าเว็บ

    # location regex ชนะ prefix location — สองเส้นทางนี้จึงโดน rate limit
    location ~ ^/api/auth/(login|forgot-password)$ {
        limit_req zone=authlimit burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
    }

    # ── SPA ─────────────────────────────────────────────────────────────
    # ไม่มี try_files = refresh หน้า /admin/equipment ตรง ๆ แล้ว 404 ทุกครั้ง
    location / {
        try_files $uri $uri/ /index.html;
    }
}
