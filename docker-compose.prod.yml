# Deploy จริง — อ่านค่าจาก .env ที่ root (คัดลอกจาก .env.prod.example)
#
#   cp .env.prod.example .env && vi .env
#   ./gen-self-signed-cert.sh <ip-ของ-vm>      # สร้าง cert ก่อน up ครั้งแรก (ดู DEPLOY-PLAN.md)
#   docker compose -f docker-compose.prod.yml up --build -d
#
# เข้าใช้งานที่ https://<ip-ของ-vm>/ — :80 redirect ไป :443 อัตโนมัติ
# backend กับ db ไม่ publish port ออกนอก คุยกันผ่าน network ภายในของ compose

x-logging: &default-logging
  # ไม่จำกัดขนาด log จะกินดิสก์ VM จนเต็มภายในไม่กี่เดือน
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build: ./backend
    # alembic ต้องรันก่อนเสมอ ไม่งั้น deploy ใหม่จะบูตใส่ DB เปล่าแล้ว 500 ทุก request
    #
    # ponytail: worker เดียวเพราะ APScheduler รันใน process เดียวกับแอป
    # หลาย worker = job แจ้งเตือน/อีเมลเกินกำหนดยิงซ้ำตามจำนวน worker ทุกคืน
    # async worker เดียวรับ 300 คนสบาย ถ้าวันหนึ่งต้องสเกล ให้แยก scheduler
    # ออกไปเป็น service ของตัวเองก่อน แล้วค่อยเพิ่ม --workers
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      # ตั้งทับ env_file เสมอ — กันพลาดจากการก็อป DATABASE_URL ของ dev ที่ชี้ localhost
      # (ใน container คำว่า localhost คือตัว backend เอง ไม่ใช่ Postgres)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # vite ฝังค่านี้ลง bundle ตอน build ไม่ใช่ตอน run จึงต้องส่งเป็น build arg
        # /api = ยิงกลับ origin เดิมแล้วให้ nginx proxy ต่อ ไม่ต้องฝัง IP ลงไฟล์ JS
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # cert self-signed จาก ./gen-self-signed-cert.sh (หรือ certbot ทีหลัง) — ห้าม commit, ดู .gitignore
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  uploads_data:
